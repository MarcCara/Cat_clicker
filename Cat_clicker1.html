<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cat Clicker</title>
  </head>
  <body>
    <img id="gat" src="Liko.jpg" alt="Liko">
    <h3 id="contador">0</h3>

    <script>
      let cont = 0;
      document.getElementById("gat").addEventListener("click", function () {
        cont++;
        document.getElementById("contador").innerHTML = cont;
      });
    </script>
  </body>
</html>
