<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cat Clicker</title>
  </head>
  <body>
    <main>
      <h1>Cat Clicker</h1>
      <button id="cat-button" type="button" aria-label="Acariciar al gato">
        <img
          src="imagen/Liko.jpg"
          alt="Liko"
        >
      </button>
      <p>Clicks: <span id="click-count" aria-live="polite">0</span></p>
    </main>
    <script>
      const catButton = document.querySelector("#cat-button");
      const clickCount = document.querySelector("#click-count");

      let clicks = 0;

      catButton.addEventListener("click", () => {
        clicks += 1;
        clickCount.textContent = clicks.toLocaleString("es");
      });
    </script>
  </body>
</html>
