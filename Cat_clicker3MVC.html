<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="llista"></ul>
    <img id="imgGat" src="" alt="">
    <h3 id="nomActual"></h3>
    <h3 id="contActual"></h3>
</body>
<script>

let data = {
        catActive: 0,
        ncats: 4,
        gatos: [
            { name: "Pick",  image: "imagen/Pick.jpg", nclicks: 0 },
            { name: "PACO",  image: "imagen/PACO.jpg", nclicks: 0 },
            { name: "Lupa",  image: "imagen/Lupa.jpg", nclicks: 0 },
            { name: "Liri", image: "imagen/Liri.jpg", nclicks: 0 }
        ]
    };

    let model = {
        //si no estÃ¡ inicializado el localstorage lo arrancas
        init: function() {
            //AQUI NO HAY QUE HACER
        },
        getGatos: function() {
            return data.gatos;
        },
        getGatoActual: function(){
            return data.gatos[data.catActive];
        },
        canviGat: function(id){
            data.catActive=id;
        },
        clickGato: function(){
            data.gatos[data.catActive].nclicks++;
        }
    };

    let controller = {
        canviGat: function(id){
            //Actualitzo les dades
            model.canviGat(id);
            //Repinto
            view.renderGatoActual();
        },
        clickGato:function(){
            //actualitzo les dades
            model.clickGato();
            //repinto
            view.renderGatoActual();
        },
        getGatos: function() {           
            return model.getGatos();
        },
        getGatoActual: function(){
            return model.getGatoActual();
        },
        init: function() {
            model.init();
            view.init();
        }
    };

    let view = {
        init: function() {
            view.renderLlista();
            view.renderGatoActual(); 

            //AFEGEIXO UN LISTENER AL GAT
            document.getElementById("imgGat").addEventListener("click",function(){
                controller.clickGato();                
            })

        },
        renderLlista: function(){
            let datos=controller.getGatos();
            htmlStr=""
                datos.forEach((element,index) => {       
                    htmlStr += `<li id='${index}'>${element.name}</li>`    
                });
                document.getElementById("llista").innerHTML=htmlStr;

                 document.getElementById("llista").addEventListener("click",function(e){
                    console.log("has apretat al gat en la llista" + e.target.id)
                    controller.canviGat(e.target.id)
                })
        },
        renderGatoActual: function(){
            let datosGatoActual =  controller.getGatoActual();
            document.getElementById("imgGat").src=datosGatoActual.image
            document.getElementById("nomActual").innerHTML=datosGatoActual.name;
            document.getElementById("contActual").innerHTML=datosGatoActual.nclicks;
        },

    
    };

    controller.init();

</script>
